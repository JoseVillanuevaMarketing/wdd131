<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form | WDD 131 - Dynamic Web Fundamentals</title>

    <meta name="description" content="WDD 131 Dynamic Web Fundamentals Product Review Form by Jose Villanueva">
    <meta name="author" content="Jose Villanueva">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/form.css">

    <!-- JavaScript -->
    <script src="scripts/form.js" defer></script>

</head>

<body>

<header>

    <h1>Product Review</h1>

</header>

<main>

<form method="get" action="review.html">

    <!-- Product Name -->

    <fieldset>

        <legend>Product Information</legend>

        <label for="product">
            Product Name *
        </label>

        <select id="product" name="product" required>

            <option value="" selected disabled>
                Select a Product ...
            </option>

            <!-- JavaScript will create the remaining options -->

        </select>

    </fieldset>



    <!-- Overall Rating -->

    <fieldset>

        <legend>Overall Rating *</legend>

        <label for="rating1">☆</label>
        <input
            type="radio"
            id="rating1"
            name="rating"
            value="1"
            required>

        <label for="rating2">☆☆</label>
        <input
            type="radio"
            id="rating2"
            name="rating"
            value="2"
            required>

        <label for="rating3">☆☆☆</label>
        <input
            type="radio"
            id="rating3"
            name="rating"
            value="3"
            required>

        <label for="rating4">☆☆☆☆</label>
        <input
            type="radio"
            id="rating4"
            name="rating"
            value="4"
            required>

        <label for="rating5">☆☆☆☆☆</label>
        <input
            type="radio"
            id="rating5"
            name="rating"
            value="5"
            required>

    </fieldset>



    <!-- Installation Date -->

    <fieldset>

        <legend>Date of Installation</legend>

        <label for="installDate">
            Installation Date *
        </label>

        <input
            type="date"
            id="installDate"
            name="installDate"
            required>

    </fieldset>



    <!-- Useful Features -->

    <fieldset>

        <legend>Useful Features (Check all that apply)</legend>

        <label>
            <input
                type="checkbox"
                id="durability"
                name="features"
                value="Durability">
            Durability
        </label>

        <label>
            <input
                type="checkbox"
                id="ease"
                name="features"
                value="Ease of Use">
            Ease of Use
        </label>

        <label>
            <input
                type="checkbox"
                id="performance"
                name="features"
                value="Performance">
            Performance
        </label>

        <label>
            <input
                type="checkbox"
                id="design"
                name="features"
                value="Design">
            Design
        </label>

    </fieldset>



    <!-- Written Review -->

    <fieldset>

        <legend>Written Review (Optional)</legend>

        <label for="review">
            Your Review
        </label>

        <textarea
            id="review"
            name="review"
            rows="6"
            placeholder="Write your comments here..."></textarea>

    </fieldset>



    <!-- User Name -->

    <fieldset>

        <legend>User Information</legend>

        <label for="username">
            Your Name (Optional)
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Your name">

    </fieldset>



    <!-- Submit -->

    <input
        type="submit"
        value="Submit Review"
        class="submit-btn">

</form>

</main>



<footer>

    <p>

        &copy;
        <span id="currentyear"></span>

        Jose Villanueva | Bolivia

    </p>

    <p id="lastModified"></p>

</footer>

</body>
</html>
