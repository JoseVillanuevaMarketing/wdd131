<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Sky Mark Digital</title>

    <meta name="description" content="Contact Sky Mark Digital for professional digital marketing services.">

    <meta name="author" content="Jose Villanueva">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="styles/project.css">
    <link rel="stylesheet" href="styles/project-large.css">

    <!-- JavaScript -->

    <script src="scripts/project.js" defer></script>

</head>

<body>

<header>

    <div class="logo">
        <h1>Sky Mark Digital</h1>
    </div>

    <button id="menu" aria-label="Open Navigation"></button>

    <nav class="navigation">

        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>

    </nav>

</header>

<main>

    <section class="hero">

        <div class="hero-text">

            <h2>Let's Grow Your Business</h2>

            <p>

                Fill out the form below and our team will contact you
                as soon as possible.

            </p>

        </div>

    </section>

    <section class="about">

        <h2>Contact Form</h2>

        <form action="#" method="get">

            <!-- Name -->

            <label for="fullname">

                Full Name

            </label>

            <input
                type="text"
                id="fullname"
                name="fullname"
                required>

            <!-- Email -->

            <label for="email">

                Email Address

            </label>

            <input
                type="email"
                id="email"
                name="email"
                required>

            <!-- Service -->

            <label for="service">

                Service Needed

            </label>

            <select
                id="service"
                name="service"
                required>

                <option value="" selected disabled>
                    Select a Service
                </option>

                <option value="Social Media Marketing">
                    Social Media Marketing
                </option>

                <option value="Website Design">
                    Website Design
                </option>

                <option value="Graphic Design">
                    Graphic Design
                </option>

                <option value="Facebook Ads">
                    Facebook Ads
                </option>

            </select>

            <!-- Budget -->

            <label for="budget">

                Estimated Budget

            </label>

            <select
                id="budget"
                name="budget">

                <option value="500">$500 - $1,000</option>

                <option value="1000">$1,000 - $3,000</option>

                <option value="3000">$3,000+</option>

            </select>

            <!-- Message -->

            <label for="message">

                Project Details

            </label>

            <textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Tell us about your project..."></textarea>

            <input
                class="btn"
                type="submit"
                value="Send Request">

        </form>

    </section>

</main>

<footer>

    <p>

        &copy;

        <span id="currentyear"></span>

        | Jose Villanueva | Sky Mark Digital

    </p>

    <p id="lastModified"></p>

    <p>

        <a href="references.html">

            References

        </a>

    </p>

</footer>

</body>
</html>
